name: Daily domain health check
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily (08:47 IST, 03:17 London, 22:17 New York)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node monitor.js
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Save today's results for tomorrow's comparison
        run: |
          git config user.name "senderwatch-bot"
          git config user.email "senderwatch-bot@users.noreply.github.com"
          git add state.json && git commit -m "Daily health snapshot" || echo "No changes"
          git push
